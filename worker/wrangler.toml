name = "elliotbetancourt-contact-form"
main = "index.js"
compatibility_date = "2024-01-01"

[vars]
BREVO_LIST_ID = "2"
CONTACT_BRAND = "elliotbetancourt"
ALLOWED_ORIGIN = "https://elliotbetancourt.com"

# API key is set as a secret: npx wrangler secret put BREVO_API_KEY

[env.preview]
name = "elliotbetancourt-contact-form-preview"
compatibility_date = "2024-01-01"

[env.preview.vars]
BREVO_LIST_ID = "preview-disabled"
CONTACT_BRAND = "elliotbetancourt-preview"
ALLOWED_ORIGIN = "*"
