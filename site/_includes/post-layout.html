---
layout: layout.html
---

<article class="post">
	<header class="post-header">
		<h1>{{ title }}</h1>
		<div class="post-meta">
			<time datetime="{{ date | date: '%Y-%m-%d' }}">{{ date | date: "%B %d, %Y" }}</time>
		</div>
	</header>
	<div class="post-content">
		{{ content }}
	</div>
</article>
